
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#191922">
<title>TNT APK - Gerador de Keys</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 25%, #310b12 0%, transparent 55%),
    #050505;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 75px;
  background: #191922;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  font-size: 23px;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: linear-gradient(135deg,#555,#111);
  display: grid;
  place-items: center;
  font-size: 23px;
  border: 1px solid #555;
}

main {
  max-width: 650px;
  margin: 30px auto;
  padding: 0 16px 35px;
}

.card {
  background: #141416;
  border: 1px solid #292929;
  border-radius: 4px;
  padding: 25px 15px;
  text-align: center;
  margin-bottom: 28px;
}

.big-avatar {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  margin: 0 auto 18px;
  display: grid;
  place-items: center;
  font-size: 43px;
  background: linear-gradient(135deg,#555,#111);
  border: 2px solid #333;
}

.generate-title {
  font-size: 27px;
  margin-bottom: 15px;
}

button {
  cursor: pointer;
  border: none;
  color: white;
}

.generate-btn {
  width: 100%;
  padding: 16px;
  border-radius: 5px;
  font-size: 17px;
  font-weight: bold;
  background: linear-gradient(100deg,#a31330,#e12d52);
}

.generate-btn:disabled {
  opacity: .6;
  cursor: wait;
}

.loader {
  display: none;
  margin: 18px 0;
}

.loader.show {
  display: block;
}

.spinner {
  width: 42px;
  height: 42px;
  border: 4px solid #383838;
  border-top-color: #e12d52;
  border-radius: 50%;
  margin: auto;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.count {
  font-size: 27px;
  font-weight: bold;
  margin-top: 10px;
  color: #ff4770;
}

.status {
  color: #aaa;
  margin-top: 8px;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-bottom: 28px;
}

.stat {
  background: #141416;
  border: 1px solid #292929;
  padding: 22px 8px;
  text-align: center;
  font-size: 20px;
  border-radius: 4px;
}

.stat-icon {
  font-size: 30px;
  color: #666;
  margin-bottom: 10px;
}

.counter {
  background: #17171a;
  border: 1px solid #333;
  padding: 16px 10px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  color: #aaa;
  margin-bottom: 30px;
  font-size: 15px;
}

.section-title {
  color: #aaa;
  font-size: 19px;
  margin-bottom: 14px;
}

.key-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.key-item {
  display: flex;
  align-items: center;
  background: #202024;
  border: 1px solid #424249;
  border-radius: 4px;
  padding: 15px 12px;
  gap: 13px;
  min-height: 70px;
}

.key-number {
  color: #ec4782;
  font-size: 21px;
}

.key-icon {
  color: #888;
  font-size: 23px;
}

.key-value {
  flex: 1;
  font-size: clamp(14px,4vw,19px);
  overflow-wrap: anywhere;
}

.copy-btn {
  background: transparent;
  color: #888;
  font-size: 25px;
  padding: 5px;
}

.copy-btn:active {
  color: #ff4770;
}

.empty {
  text-align: center;
  color: #777;
  padding: 20px;
  background: #141416;
  border: 1px solid #292929;
}

.notice {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin-top: 25px;
}

@media(max-width:400px) {
  .stats { gap: 12px; }
  .stat { font-size: 17px; }
  header { font-size: 20px; }
}
</style>
</head>

<body>

<header>
  <span>Adm Proxy tnt</span>
  <div class="avatar">🎅</div>
</header>

<main>

  <section class="card">

    <div class="big-avatar">🎅</div>

    <div class="generate-title">
      Gerar uma key nova
    </div>

    <div class="loader" id="loader">
      <div class="spinner"></div>

      <div class="count">
        <span id="seconds">5</span>s
      </div>

      <div class="status" id="status">
        Gerando sua Key, aguarde...
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">
      GERAR KEY
    </button>

  </section>

  <section class="stats">

    <div class="stat">
      <div class="stat-icon">🔧</div>
      <div>Key Geradas</div>
      <strong id="generatedCount">0</strong>
    </div>

    <div class="stat">
      <div class="stat-icon">⌁</div>
      <div>Keys Vencidas</div>
      <strong>0</strong>
    </div>

  </section>

  <section class="counter">
    <span>Keys: 1</span>
    <span>➜</span>
    <span>Keys disabled: 0</span>
  </section>

  <div class="section-title">
    Recently registered keys
  </div>

  <div class="key-list" id="keyList">
    <div class="empty">
      Nenhuma Key gerada ainda.
    </div>
  </div>

  <div class="notice">
    TNT APK • Sistema de geração de keys
  </div>

</main>

<script>

// ÚNICA KEY FIXA DO GERADOR
const FIXED_KEY = 'TNT-APK-2026-XIT';

let generated = 0;
let busy = false;

const generateBtn =
  document.getElementById('generateBtn');

const loader =
  document.getElementById('loader');

const seconds =
  document.getElementById('seconds');

const status =
  document.getElementById('status');

const keyList =
  document.getElementById('keyList');

const generatedCount =
  document.getElementById('generatedCount');

function generateKey() {

  if (busy) return;

  busy = true;

  generateBtn.disabled = true;
  generateBtn.textContent = 'AGUARDE...';

  loader.classList.add('show');

  let remaining = 5;

  seconds.textContent = remaining;
  status.textContent = 'Gerando sua Key, aguarde...';

  const countdown = setInterval(() => {

    remaining--;

    if (remaining > 0) {

      seconds.textContent = remaining;

    } else {

      clearInterval(countdown);

      // Sempre gera exatamente a mesma Key
      const currentKey = FIXED_KEY;

      generated++;

      generatedCount.textContent = generated;

      addKeyToList(currentKey, generated);

      status.textContent = 'Key gerada com sucesso!';

      loader.classList.remove('show');

      generateBtn.disabled = false;
      generateBtn.textContent = 'GERAR KEY NOVA';

      busy = false;
    }

  }, 1000);
}

function addKeyToList(key, number) {

  const empty = keyList.querySelector('.empty');

  if (empty) {
    empty.remove();
  }

  const item = document.createElement('div');
  item.className = 'key-item';

  const numberEl = document.createElement('span');
  numberEl.className = 'key-number';
  numberEl.textContent = number;

  const icon = document.createElement('span');
  icon.className = 'key-icon';
  icon.textContent = '🔑';

  const value = document.createElement('span');
  value.className = 'key-value';
  value.textContent = key;

  const copy = document.createElement('button');
  copy.className = 'copy-btn';
  copy.textContent = '▢';
  copy.title = 'Copiar Key';

  copy.addEventListener('click', async () => {

    try {

      await navigator.clipboard.writeText(key);

    } catch {

      const field = document.createElement('textarea');

      field.value = key;

      document.body.appendChild(field);

      field.select();
      document.execCommand('copy');

      field.remove();
    }

    copy.textContent = '✓';

    setTimeout(() => {
      copy.textContent = '▢';
    }, 1500);

  });

  item.append(numberEl, icon, value, copy);

  keyList.prepend(item);
}

generateBtn.addEventListener('click', generateKey);

</script>

</body>
  </html>
