
<section class="card">
  <div class="card-heading">
    <div class="icon-box">🔐</div>
    <div>
      <h2>Desbloquear Gerador</h2>
      <p class="muted">Entre no canal para continuar.</p>
    </div>
  </div>

  <div id="whatsappGate">
    <a
      class="btn btn-green"
      href="https://whatsapp.com/channel/0029Vb7b86gLo4hktDKFZ63x"
      target="_blank"
      rel="noopener noreferrer"
      id="joinChannel">
      💬 ENTRAR NO CANAL
    </a>

    <button
      class="btn btn-primary"
      id="verifyButton"
      type="button">
      🔎 JÁ ENTREI — VERIFICAR
    </button>

    <p class="note" id="verifyStatus" aria-live="polite">
      Acesse o canal e depois volte aqui para continuar.
    </p>
  </div>

  <div id="keyArea" hidden>
    <div class="statusbar">
      <span>Etapa do canal</span>
      <span class="status-ready">✓ CONFIRMADA MANUALMENTE</span>
    </div>

    <p class="muted">
      Você pode continuar para o serviço de geração de keys.
    </p>

    <a
      class="btn btn-primary"
      href="https://proxy-90bc.onrender.com/getkey"
      target="_blank"
      rel="noopener noreferrer"
      id="generateKey">
      ⚡ GERAR MINHA KEY
    </a>
  </div>
</section>

<style>
[hidden] {
  display: none !important;
}

#verifyButton:disabled {
  opacity: .7;
  cursor: wait;
}

.spinner {
  display: inline-block;
  width: 15px;
  height: 15px;
  border: 2px solid #ffffff55;
  border-top-color: white;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>

<script>
const verifyButton = document.getElementById("verifyButton");
const verifyStatus = document.getElementById("verifyStatus");
const keyArea = document.getElementById("keyArea");

let checking = false;

verifyButton.addEventListener("click", function () {
  if (checking) return;

  checking = true;
  verifyButton.disabled = true;
  verifyButton.innerHTML =
    '<span class="spinner"></span> VERIFICANDO ACESSO...';

  verifyStatus.textContent =
    "Conferindo sua etapa. Aguarde um instante...";

  setTimeout(function () {
    verifyButton.disabled = false;
    verifyButton.textContent = "✓ ETAPA CONCLUÍDA";
    verifyStatus.textContent =
      "Etapa confirmada manualmente. A inscrição não foi verificada pelo WhatsApp.";
    keyArea.hidden = false;
    checking = false;

    keyArea.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }, 1800);
});
  </script>
