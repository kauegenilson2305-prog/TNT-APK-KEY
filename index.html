<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <title>Proxy V24 grátis</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at top, #103b70 0%, transparent 55%),
        #050914;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 30px 23px;
      text-align: center;
      background: rgba(8, 18, 38, 0.97);
      border: 1px solid #147cff;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(0, 119, 255, 0.22);
    }

    .logo {
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 2px solid #198cff;
      border-radius: 50%;
      color: #59b9ff;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 0 22px rgba(0, 119, 255, 0.28);
    }

    h1 {
      margin-bottom: 12px;
      font-size: 27px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-bottom: 24px;
      color: #b7c8df;
      font-size: 14px;
      line-height: 1.7;
    }

    .status {
      margin-bottom: 18px;
      padding: 12px;
      color: #ffcc55;
      background: #201d13;
      border: 1px solid #6b5422;
      border-radius: 9px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .success {
      color: #5cffad;
      background: #0b251d;
      border-color: #176b4a;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px 12px;
      border: none;
      border-radius: 9px;
      color: #fff;
      background: linear-gradient(90deg, #0865e9, #159dff);
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
    }

    .button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    .download {
      background: linear-gradient(90deg, #087b46, #13bd70);
    }

    .generator {
      margin-top: 12px;
      background: linear-gradient(90deg, #0865e9, #159dff);
    }

    #verification,
    #unlocked {
      display: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 17px;
      border: 4px solid #18385e;
      border-top-color: #27a3ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-track {
      width: 100%;
      height: 7px;
      margin-top: 18px;
      overflow: hidden;
      background: #17243a;
      border-radius: 10px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #169aff;
      transition: width 1s linear;
    }

    .small {
      margin-top: 22px;
      color: #7489a7;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">V24</div>

    <h1>Proxy V24 grátis</h1>

    <p class="subtitle">
      Entre no canal para desbloquear o acesso ao download e ao gerador de key.
    </p>

    <!-- ETAPA 1: SOMENTE O BOTÃO DO CANAL -->
    <section id="locked">
      <div class="status">🔒 ACESSO BLOQUEADO</div>

      <a
        id="channelButton"
        class="button"
        href="https://whatsapp.com/channel/0029Vb7b86gLo4hktDKFZ63x"
        target="_blank"
        rel="noopener noreferrer"
      >
        INSCREVA-SE NO CANAL
      </a>
    </section>

    <!-- ETAPA 2: VERIFICAÇÃO -->
    <section id="verification">
      <div class="spinner"></div>

      <div class="status">VERIFICANDO...</div>

      <p class="subtitle" id="countdown">
        Aguarde 15 segundos...
      </p>

      <div class="progress-track">
        <div class="progress-bar" id="progress"></div>
      </div>
    </section>

    <!-- ETAPA 3: OS DOIS BOTÕES -->
    <section id="unlocked">
      <div class="status success">✓ ETAPA CONCLUÍDA</div>

      <p class="subtitle">
        Escolha uma das opções abaixo.
      </p>

      <a
        class="button download"
        href="https://alpharede.com/IbE9JquzaCl"
        target="_blank"
        rel="noopener noreferrer"
      >
        DOWNLOAD
      </a>

      <a
        class="button generator"
        href="https://alpharede.com/LQWvBSf3t4p"
        target="_blank"
        rel="noopener noreferrer"
      >
        GERAR KEY
      </a>
    </section>

    <p class="small">Proxy V24 grátis</p>
  </main>

  <script>
    const TEMPO = 15;
    let iniciou = false;

    const botaoCanal = document.getElementById("channelButton");

    // A verificação começa quando a pessoa clica no botão do canal.
    botaoCanal.addEventListener("click", function () {
      if (iniciou) return;
      iniciou = true;

      document.getElementById("locked").style.display = "none";
      document.getElementById("verification").style.display = "block";

      let restante = TEMPO;
      const contador = document.getElementById("countdown");
      const barra = document.getElementById("progress");

      const intervalo = setInterval(function () {
        restante--;

        const porcentagem = ((TEMPO - restante) / TEMPO) * 100;
        barra.style.width = porcentagem + "%";

        if (restante > 0) {
          contador.textContent =
            "Aguarde " + restante + " segundos...";
        } else {
          clearInterval(intervalo);

          document.getElementById("verification").style.display = "none";
          document.getElementById("unlocked").style.display = "block";
        }
      }, 1000);
    });
  </script>
</body>
</html>
