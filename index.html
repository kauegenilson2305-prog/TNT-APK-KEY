
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06152c">
<title>TNT APK - Gerador de Keys</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: radial-gradient(
        ellipse at top,
        #102d55,
        #061326 55%,
        #020712
    );
    overflow-x: hidden;
}

#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.luzes {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    z-index: 3;
    pointer-events: none;
}

.luzes span {
    width: 9px;
    height: 18px;
    border-radius: 50%;
    background: #19c8ff;
    box-shadow: 0 0 12px currentColor;
    animation: piscar 1s infinite alternate;
}

.luzes span:nth-child(2n) {
    background: #ff3333;
    animation-delay: .4s;
}

.luzes span:nth-child(3n) {
    background: #ffe66d;
    animation-delay: .8s;
}

@keyframes piscar {
    from { opacity: .35; }
    to { opacity: 1; }
}

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 65px 18px 35px;
}

.painel {
    width: 100%;
    max-width: 410px;
    padding: 30px 23px;
    text-align: center;
    border-radius: 20px;
    background: rgba(4, 17, 38, .91);
    border: 2px solid #19c8ff;
    box-shadow:
        0 0 15px #19c8ff,
        0 0 35px rgba(25,200,255,.35),
        inset 0 0 20px rgba(25,200,255,.08);
    animation: aparecer .8s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.santa {
    font-size: 62px;
    margin-bottom: 8px;
    animation: flutuar 3s ease-in-out infinite;
}

@keyframes flutuar {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

h1 {
    font-size: 31px;
    font-weight: 900;
    color: white;
    text-shadow: 0 0 12px #19c8ff;
}

h1 span {
    color: #19c8ff;
}

.subtitulo {
    margin-top: 9px;
    font-size: 12px;
    letter-spacing: 3px;
    color: #a9eaff;
}

.decoracao {
    margin: 20px 0;
    color: #ffe66d;
    font-size: 14px;
}

.mensagem {
    color: #d6edff;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 23px;
}

.status {
    display: inline-block;
    padding: 9px 17px;
    border-radius: 30px;
    border: 1px solid #19c8ff;
    color: #65dcff;
    box-shadow: 0 0 12px rgba(25,200,255,.4);
    font-size: 12px;
    margin-bottom: 22px;
}

#contador {
    display: none;
    font-size: 23px;
    font-weight: bold;
    color: #ffe66d;
    margin: 22px 0;
    text-shadow: 0 0 12px #ffe66d;
}

#resultado {
    display: none;
    margin: 20px 0;
    padding: 17px 8px;
    border-radius: 10px;
    background: rgba(25,200,255,.10);
    border: 1px solid #19c8ff;
    box-shadow: 0 0 15px rgba(25,200,255,.25);
    overflow-wrap: anywhere;
    animation: aparecer .4s ease;
}

#keyTexto {
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
}

.botao {
    display: block;
    width: 100%;
    padding: 16px 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(120deg, #19c8ff, #1264ce);
    color: #001020;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(25,200,255,.65);
    transition: .25s;
}

.botao:hover {
    transform: scale(1.03);
    box-shadow: 0 0 30px #19c8ff;
}

#copiar {
    display: none;
    margin-top: 12px;
    background: linear-gradient(120deg, #ffe66d, #ffad32);
    color: #171000;
}

#gerarNova {
    display: none;
    margin-top: 12px;
}

.aviso {
    margin-top: 22px;
    color: #a8bfd4;
    font-size: 11px;
    line-height: 1.6;
}

.rodape {
    margin-top: 20px;
    color: #19c8ff;
    font-size: 11px;
    letter-spacing: 2px;
}

@media(max-width:380px) {
    .painel {
        padding: 25px 16px;
    }

    h1 {
        font-size: 27px;
    }

    #keyTexto {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="luzes">
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
    <span></span><span></span><span></span>
</div>

<canvas id="snow"></canvas>

<main class="container">
<section class="painel">

    <div class="santa">🎅</div>

    <h1>TNT <span>APK</span></h1>

    <div class="subtitulo">GERADOR DE KEYS</div>

    <div class="decoracao">❄️ ✨ 🎄 ✨ ❄️</div>

    <div class="status">● SISTEMA ONLINE</div>

    <p class="mensagem">
        Bem-vindo ao gerador TNT APK!<br>
        Clique abaixo para gerar sua KEY.
    </p>

    <button class="botao" id="gerar">
        GERAR KEY
    </button>

    <div id="contador">
        Aguarde: <span id="tempo">5</span>s
    </div>

    <div id="resultado">
        <div id="keyTexto"></div>
    </div>

    <button class="botao" id="copiar">
        📋 COPIAR KEY
    </button>

    <button class="botao" id="gerarNova">
        🔑 GERAR KEY NOVA
    </button>

    <div class="aviso">
        Boas festas! Aproveite o gerador TNT APK.
    </div>

    <div class="rodape">
        TNT APK © 2026
    </div>

</section>
</main>

<script>

/* LISTA DE KEYS */
const keys = [
    "TNT-APK-73927392",
    "TNT-APK-01340134",
    "TNT-APK-93679367",
    "TNT-APK-29452945",
    "TNT-APK-10061006",
    "TNT-APK-63276327",
    "TNT-APK-41364136"
];

/* CONTROLE DO GERADOR */
let indice = 0;
let temporizador = null;
let gerando = false;

const botaoGerar = document.getElementById("gerar");
const botaoCopiar = document.getElementById("copiar");
const botaoNova = document.getElementById("gerarNova");

const contador = document.getElementById("contador");
const tempo = document.getElementById("tempo");
const resultado = document.getElementById("resultado");
const keyTexto = document.getElementById("keyTexto");

/* INICIAR GERAÇÃO */
function iniciarGeracao() {

    if (gerando) return;

    gerando = true;

    clearInterval(temporizador);

    botaoGerar.style.display = "none";
    botaoNova.style.display = "none";
    botaoCopiar.style.display = "none";
    resultado.style.display = "none";

    contador.style.display = "block";

    let segundos = 5;
    tempo.textContent = segundos;

    temporizador = setInterval(() => {

        segundos--;
        tempo.textContent = segundos;

        if (segundos <= 0) {
            clearInterval(temporizador);
            mostrarKey();
        }

    }, 1000);
}

/* MOSTRAR KEY SEM INDICAR A POSIÇÃO */
function mostrarKey() {

    const keyAtual = keys[indice];

    keyTexto.textContent = keyAtual;

    contador.style.display = "none";
    resultado.style.display = "block";

    botaoCopiar.style.display = "block";
    botaoNova.style.display = "block";

    // CICLO INFINITO
    indice = (indice + 1) % keys.length;

    gerando = false;
}

/* COPIAR KEY */
async function copiarKey() {

    const texto = keyTexto.textContent;

    try {

        await navigator.clipboard.writeText(texto);

        botaoCopiar.textContent = "✓ KEY COPIADA!";

    } catch (erro) {

        const campo = document.createElement("textarea");

        campo.value = texto;
        document.body.appendChild(campo);

        campo.select();
        document.execCommand("copy");

        campo.remove();

        botaoCopiar.textContent = "✓ KEY COPIADA!";
    }

    setTimeout(() => {
        botaoCopiar.textContent = "📋 COPIAR KEY";
    }, 1800);
}

botaoGerar.addEventListener("click", iniciarGeracao);
botaoNova.addEventListener("click", iniciarGeracao);
botaoCopiar.addEventListener("click", copiarKey);


/* NEVE ANIMADA */
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flocos = [];

function ajustarCanvas() {

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function criarNeve() {

    flocos = [];

    for (let i = 0; i < 100; i++) {

        flocos.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            tamanho: Math.random() * 3 + 1,
            velocidade: Math.random() * 1.5 + .4,
            vento: Math.random() * .8 - .4
        });
    }
}

function animarNeve() {

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    flocos.forEach(f => {

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.tamanho,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "rgba(220,245,255,.85)";
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#a9eaff";

        ctx.fill();

        f.y += f.velocidade;
        f.x += f.vento;

        if (f.y > window.innerHeight + 5) {
            f.y = -5;
            f.x = Math.random() * window.innerWidth;
        }

        if (f.x > window.innerWidth + 5) {
            f.x = -5;
        }

        if (f.x < -5) {
            f.x = window.innerWidth + 5;
        }

    });

    ctx.shadowBlur = 0;

    requestAnimationFrame(animarNeve);
}

window.addEventListener("resize", () => {
    ajustarCanvas();
    criarNeve();
});

ajustarCanvas();
criarNeve();
animarNeve();

</script>

</body>
</html>
