<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08051a" />
  <title>TNT APK • Gerador Grátis</title>
  <style>
    :root { color-scheme: dark; --blue:#19c8ff; --purple:#bd43ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px; font-family: Inter, system-ui, Arial, sans-serif;
      color: #fff; background: #050513 url('fundo-tntapk.png') center/cover fixed no-repeat;
      position: relative; overflow-x: hidden;
    }
    body::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg,rgba(3,5,20,.36),rgba(3,4,18,.82)); z-index:-1; }
    .stars { position:fixed; inset:0; pointer-events:none; opacity:.5; background-image:radial-gradient(2px 2px at 20% 30%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 70% 20%,#8deaff 45%,transparent 60%),radial-gradient(2px 2px at 85% 75%,#d69aff 45%,transparent 60%); background-size:230px 190px,170px 210px,260px 230px; animation: drift 24s linear infinite; }
    @keyframes drift { to { background-position:230px 190px,-170px 210px,260px -230px; } }
    .panel { width:min(100%,480px); padding:clamp(22px,5vw,34px); border:1px solid rgba(100,190,255,.38); border-radius:25px; background:rgba(5,9,30,.78); backdrop-filter:blur(13px); box-shadow:0 0 45px rgba(0,153,255,.18),0 0 85px rgba(172,40,255,.12); text-align:center; }
    .brand { margin:0; font-size:clamp(2.8rem,12vw,4.6rem); line-height:1; font-weight:1000; letter-spacing:-.07em; font-style:italic; background:linear-gradient(100deg,#eafcff 4%,#20caff 42%,#c46aff 78%,#fff 100%); color:transparent; background-clip:text; -webkit-background-clip:text; filter:drop-shadow(0 0 15px rgba(31,187,255,.55)); }
    .subtitle { margin:12px 0 25px; letter-spacing:.25em; font-size:.85rem; font-weight:800; color:#e6d5ff; }
    .status { color:#b9c9ee; font-size:.92rem; margin:0 0 15px; }
    .keybox { min-height:66px; display:flex; align-items:center; justify-content:center; padding:14px 10px; margin:0 0 18px; border:1px solid rgba(60,190,255,.48); border-radius:13px; background:rgba(1,5,20,.78); color:#fff; font-size:clamp(.95rem,4vw,1.15rem); font-weight:800; letter-spacing:.04em; overflow-wrap:anywhere; box-shadow:inset 0 0 20px rgba(0,145,255,.08); }
    .keybox.empty { color:#8c9cbd; font-size:.88rem; font-weight:500; letter-spacing:0; }
    button { width:100%; border:0; border-radius:13px; padding:16px 18px; color:white; font-weight:900; font-size:1rem; letter-spacing:.06em; cursor:pointer; transition:transform .18s,filter .18s,opacity .18s; }
    button:hover:not(:disabled) { transform:translateY(-2px); filter:brightness(1.13); }
    button:active:not(:disabled) { transform:scale(.985); }
    button:disabled { cursor:wait; opacity:.65; }
    .primary { background:linear-gradient(100deg,#087edb,#3159ef 55%,#8d38e8); box-shadow:0 7px 24px rgba(22,130,255,.28); }
    .copy { margin-top:11px; padding:12px; font-size:.88rem; background:rgba(255,255,255,.09); border:1px solid rgba(190,210,255,.22); }
    .loader-wrap { display:none; padding:8px 0 17px; }
    .loader-wrap.show { display:block; }
    .spinner { width:55px; height:55px; margin:0 auto 12px; border:5px solid rgba(255,255,255,.13); border-top-color:var(--blue); border-right-color:var(--purple); border-radius:50%; animation:spin .8s linear infinite; box-shadow:0 0 22px rgba(30,190,255,.2); }
    @keyframes spin { to { transform:rotate(360deg); } }
    .count { color:#fff; font-size:1.55rem; font-weight:900; }
    .hint { color:#aab9dc; font-size:.78rem; margin:19px 0 0; }
    .hidden { display:none !important; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="panel">
    <h1 class="brand">TNTAPK</h1>
    <p class="subtitle">GERADOR GRÁTIS</p>
    <p class="status" id="status">Toque no botão para gerar sua key.</p>
    <div class="keybox empty" id="keyBox" aria-live="polite">SUA KEY APARECERÁ AQUI</div>
    <div class="loader-wrap" id="loader" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="count"><span id="seconds">5</span>s</div>
      <div class="status">Gerando sua key, aguarde...</div>
    </div>
    <button class="primary" id="generateBtn" type="button">GERAR KEY</button>
    <button class="copy hidden" id="copyBtn" type="button">COPIAR KEY</button>
    <p class="hint">TNT APK • Sistema de geração de keys</p>
  </main>
  <script>
    // As keys são exibidas em sequência e reiniciam após a sétima.
    const keys = [
      'TNT-APK-10831083',
      'TNT-APK-33293329',
      'TNT-APK-46524652',
      'TNT-APK-35913591',
      'TNT-APK-38003800',
      'TNT-APK-44014401',
      'TNT-APK-51475147'
    ];
    let nextKeyIndex = 0;
    let currentKey = '';
    let busy = false;
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const keyBox = document.getElementById('keyBox');
    const loader = document.getElementById('loader');
    const seconds = document.getElementById('seconds');
    const status = document.getElementById('status');

    generateBtn.addEventListener('click', () => {
      if (busy) return;
      busy = true;
      generateBtn.disabled = true;
      copyBtn.classList.add('hidden');
      keyBox.classList.add('empty');
      keyBox.textContent = 'GERANDO...';
      status.textContent = 'Preparando sua key';
      loader.classList.add('show');
      let remaining = 5;
      seconds.textContent = remaining;
      const countdown = setInterval(() => {
        remaining -= 1;
        seconds.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(countdown);
          currentKey = keys[nextKeyIndex];
          nextKeyIndex = (nextKeyIndex + 1) % keys.length;
          keyBox.textContent = currentKey;
          keyBox.classList.remove('empty');
          loader.classList.remove('show');
          status.textContent = 'Key gerada com sucesso!';
          generateBtn.textContent = 'GERAR KEY NOVA';
          generateBtn.disabled = false;
          copyBtn.classList.remove('hidden');
          busy = false;
        }
      }, 1000);
    });

    copyBtn.addEventListener('click', async () => {
      if (!currentKey) return;
      try {
        await navigator.clipboard.writeText(currentKey);
        copyBtn.textContent = 'KEY COPIADA!';
        setTimeout(() => copyBtn.textContent = 'COPIAR KEY', 1600);
      } catch {
        const field = document.createElement('textarea');
        field.value = currentKey;
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
        copyBtn.textContent = 'KEY COPIADA!';
        setTimeout(() => copyBtn.textContent = 'COPIAR KEY', 1600);
      }
    });
  </script>
</body>
</html>
