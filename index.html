<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNT APK - Gerador de Keys</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050611;
    color: white;
    font-family: Arial, sans-serif;
}

.space {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at 20% 20%, #25205b, transparent 35%),
        radial-gradient(circle at 80% 75%, #35104d, transparent 35%),
        linear-gradient(135deg, #03040b, #080b20, #13051b);
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(2px 2px at 20% 30%, white 50%, transparent 60%),
        radial-gradient(1px 1px at 70% 20%, #a9caff 50%, transparent 60%),
        radial-gradient(2px 2px at 45% 80%, white 50%, transparent 60%);
    background-size: 260px 220px;
    animation: drift 30s linear infinite;
}

@keyframes drift {
    to { transform: translateY(-220px); }
}

.planet {
    position: fixed;
    z-index: -1;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    right: -65px;
    top: 12%;
    background: radial-gradient(circle at 30% 30%, #8e8cff, #3830a0 45%, #100b38 75%);
    box-shadow: 0 0 55px #5948ff55;
    opacity: .45;
}

.planet2 {
    position: fixed;
    z-index: -1;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    left: -35px;
    bottom: 12%;
    background: radial-gradient(circle at 30% 30%, #ff8be7, #8b247e 50%, #260b34);
    opacity: .45;
}

.container {
    width: 92%;
    max-width: 520px;
    margin: auto;
    padding: 35px 0;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: clamp(38px, 10vw, 62px);
    margin: 8px 0;
    font-weight: 900;
    background: linear-gradient(90deg, #58d9ff, #a58bff, #ff67db);
    -webkit-background-clip: text;
    color: transparent;
}

.header p {
    color: #c7c7e8;
    letter-spacing: 2px;
}

.tag {
    color: #b6b9ff;
    font-size: 12px;
    letter-spacing: 4px;
}

.card {
    border: 1px solid #6e64ff66;
    background: linear-gradient(145deg, #11152be8, #090a19ef);
    border-radius: 22px;
    padding: 28px 22px;
    box-shadow: 0 0 35px #4b35ff22;
    text-align: center;
}

.description {
    color: #b9bddb;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 22px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
}

.generate {
    width: 100%;
    padding: 17px;
    border-radius: 13px;
    color: white;
    font-size: 15px;
    background: linear-gradient(90deg, #246bff, #8a36ff, #d02dce);
    box-shadow: 0 7px 25px #6a3cff55;
}

.generate:disabled {
    opacity: .65;
    cursor: wait;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border: 1px solid #7c69ff66;
    border-radius: 13px;
    background: #050817;
}

.key {
    font-size: clamp(17px, 5vw, 23px);
    font-weight: bold;
    color: #8feaff;
    overflow-wrap: anywhere;
    margin: 15px 0;
}

.copy {
    padding: 11px 18px;
    border-radius: 9px;
    background: #24284b;
    color: white;
    border: 1px solid #696cff;
}

.loader {
    display: none;
    width: 46px;
    height: 46px;
    border: 4px solid #34365f;
    border-top-color: #8d70ff;
    border-right-color: #42d9ff;
    border-radius: 50%;
    margin: 18px auto;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.status {
    color: #c5c7e8;
    font-size: 13px;
    margin-top: 15px;
}

.footer {
    text-align: center;
    color: #777da8;
    font-size: 12px;
    margin-top: 22px;
}
</style>
</head>

<body>

<div class="space"><div class="stars"></div></div>
<div class="planet"></div>
<div class="planet2"></div>

<main class="container">

<header class="header">
    <div class="tag">PAINEL ONLINE</div>
    <h1>TNT APK</h1>
    <p>GERADOR DE KEY GRÁTIS</p>
</header>

<section class="card">

<h2>🚀 Gerador de Keys</h2>

<p class="description">
Clique no botão abaixo e aguarde 5 segundos para revelar sua key.
</p>

<button class="generate" id="generateBtn" onclick="generateKey()">
GERAR KEY GRÁTIS
</button>

<div class="loader" id="loader"></div>

<div class="result" id="result">
    <div style="font-size:12px;color:#a8aed8">
        SUA KEY
    </div>

    <div class="key" id="keyText"></div>

    <button class="copy" onclick="copyKey()">
        📋 COPIAR KEY
    </button>
</div>

<div class="status" id="status"></div>

</section>

<div class="footer">
TNT APK • YOUTUBER TNT APK
</div>

</main>

<script>

// 7 KEYS ATUALIZADAS

const keys = [
    "TNT-APK-44644446",
    "TNT-APK-32233223",
    "TNT-APK-22962296",
    "TNT-APK-92069206",
    "TNT-APK-15101510",
    "TNT-APK-98669866",
    "TNT-APK-52365236"
];

let keyIndex = 0;
let busy = false;

// GERAR KEY

function generateKey() {

    if (busy) return;

    busy = true;

    const btn = document.getElementById("generateBtn");
    const loader = document.getElementById("loader");
    const result = document.getElementById("result");
    const status = document.getElementById("status");

    btn.disabled = true;
    btn.textContent = "GERANDO KEY...";

    loader.style.display = "block";
    result.style.display = "none";

    status.textContent = "Aguarde 5 segundos...";

    setTimeout(() => {

        document.getElementById("keyText").textContent =
            keys[keyIndex];

        keyIndex = (keyIndex + 1) % keys.length;

        loader.style.display = "none";
        result.style.display = "block";

        btn.disabled = false;
        btn.textContent = "GERAR KEY NOVA";

        status.textContent = "Key gerada com sucesso!";

        busy = false;

    }, 5000);
}

// COPIAR KEY

async function copyKey() {

    const value = document.getElementById("keyText").textContent;
    const status = document.getElementById("status");

    try {

        await navigator.clipboard.writeText(value);

        status.textContent = "Key copiada com sucesso!";

    } catch (error) {

        const field = document.createElement("textarea");

        field.value = value;
        document.body.appendChild(field);

        field.select();
        document.execCommand("copy");

        field.remove();

        status.textContent = "Key copiada!";
    }
}

</script>

</body>
  </html>
