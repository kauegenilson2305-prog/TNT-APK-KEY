
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>Adm Proxy TNT • Gerador de Keys</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: #fff;
  background: #050505;
  overflow-x: hidden;
}

/* FUNDO PRETO COM EFEITOS VERMELHOS */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse at 20% 25%, rgba(130,0,0,.22), transparent 35%),
    radial-gradient(ellipse at 80% 55%, rgba(100,0,0,.20), transparent 40%),
    repeating-linear-gradient(
      105deg,
      transparent 0px,
      transparent 65px,
      rgba(130,0,0,.13) 68px,
      transparent 74px
    ),
    #050505;
}

header {
  height: 85px;
  background: #191921;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  border-bottom: 1px solid #25252b;
}

.header-title {
  font-size: 23px;
  font-weight: 400;
}

.avatar-small {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #292929;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  border: 1px solid #444;
}

.container {
  width: 100%;
  max-width: 680px;
  margin: auto;
  padding: 30px 20px;
}

.card {
  background: #141414;
  border: 1px solid #292929;
  border-radius: 4px;
  padding: 25px 20px;
  text-align: center;
  margin-bottom: 25px;
}

.avatar {
  width: 95px;
  height: 95px;
  margin: auto auto 20px;
  border-radius: 50%;
  background: linear-gradient(145deg, #444, #111);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 53px;
  border: 2px solid #383838;
}

h1 {
  font-size: 27px;
  font-weight: 400;
}

.subtitle {
  color: #929292;
  font-size: 14px;
  margin-top: 10px;
}

.key-box {
  display: none;
  margin-top: 25px;
  padding: 18px 10px;
  background: #202024;
  border: 1px solid #45454b;
  border-radius: 4px;
  font-size: 22px;
  font-weight: bold;
  overflow-wrap: anywhere;
  color: white;
}

.countdown {
  display: none;
  font-size: 60px;
  font-weight: bold;
  color: #e83b79;
  margin: 20px 0;
}

.status {
  color: #aaa;
  font-size: 15px;
  margin-top: 15px;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 15px;
  border: 1px solid #444;
  border-radius: 4px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.98);
}

.generate {
  color: white;
  background: linear-gradient(90deg, #a50024, #e52d65);
  border: none;
}

.copy {
  display: none;
  color: white;
  background: #292929;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 25px;
}

.action-card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 4px;
  padding: 25px 8px;
  text-align: center;
}

.action-icon {
  color: #686868;
  font-size: 35px;
  margin-bottom: 12px;
}

.action-card p {
  font-size: 18px;
}

.footer {
  text-align: center;
  color: #686868;
  font-size: 12px;
  margin: 30px 0 15px;
}

@media (max-width: 380px) {
  .header-title { font-size: 20px; }
  h1 { font-size: 23px; }
  .action-card p { font-size: 15px; }
}
</style>
</head>

<body>

<header>
  <div class="header-title">Adm Proxy tnt</div>
  <div class="avatar-small">🎅</div>
</header>

<main class="container">

  <section class="card">
    <div class="avatar">🎅</div>

    <h1>Gerar uma key nova</h1>
    <p class="subtitle">Gerador de acesso TNT APK</p>

    <div class="countdown" id="countdown"></div>

    <div class="key-box" id="keyBox"></div>

    <p class="status" id="status">
      Clique no botão abaixo para gerar uma key.
    </p>

    <button
      class="generate"
      id="generateBtn"
      onclick="generateKey()">
      GERAR KEY
    </button>

    <button
      class="copy"
      id="copyBtn"
      onclick="copyKey()">
      COPIAR KEY
    </button>
  </section>

  <section class="actions">
    <div class="action-card">
      <div class="action-icon">🔑</div>
      <p>Key Geradas</p>
    </div>

    <div class="action-card">
      <div class="action-icon">🔒</div>
      <p>Keys Vencidas</p>
    </div>
  </section>

  <footer class="footer">
    ADM PROXY TNT • GERADOR DE KEYS
  </footer>

</main>

<script>

/* SOMENTE AS 7 KEYS NOVAS */
const keys = [
  "TNT-43364336",
  "TNT-58405840",
  "TNT-19181918",
  "TNT-23662366",
  "TNT-50995099",
  "TNT-75327532",
  "TNT-40014001"
];

let nextKeyIndex = 0;
let currentKey = "";
let generating = false;

function generateKey() {

  if (generating) return;

  generating = true;

  const generateBtn = document.getElementById("generateBtn");
  const copyBtn = document.getElementById("copyBtn");
  const keyBox = document.getElementById("keyBox");
  const countdown = document.getElementById("countdown");
  const status = document.getElementById("status");

  generateBtn.disabled = true;
  copyBtn.style.display = "none";
  keyBox.style.display = "none";

  countdown.style.display = "block";
  status.textContent = "Preparando sua nova key...";

  let seconds = 5;
  countdown.textContent = seconds;

  const timer = setInterval(() => {

    seconds--;

    if (seconds > 0) {
      countdown.textContent = seconds;
      return;
    }

    clearInterval(timer);

    currentKey = keys[nextKeyIndex];

    nextKeyIndex = (nextKeyIndex + 1) % keys.length;

    countdown.style.display = "none";

    keyBox.textContent = currentKey;
    keyBox.style.display = "block";

    status.textContent = "Sua key foi gerada com sucesso!";

    generateBtn.textContent = "GERAR KEY NOVA";
    generateBtn.disabled = false;

    copyBtn.style.display = "block";

    generating = false;

  }, 1000);
}

async function copyKey() {

  if (!currentKey) return;

  const copyBtn = document.getElementById("copyBtn");

  try {

    await navigator.clipboard.writeText(currentKey);

  } catch (error) {

    const textarea = document.createElement("textarea");

    textarea.value = currentKey;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    textarea.remove();

  }

  copyBtn.textContent = "KEY COPIADA!";

  setTimeout(() => {
    copyBtn.textContent = "COPIAR KEY";
  }, 1800);
}

</script>

</body>
  </html>
